<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табло авиарейсов</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <h1>Табло авиарейсов</h1>
        </header>

        <section class="panel">
            <div class="panel-header">
                <h2>Расписание рейсов</h2>
                <div class="load-control">
                    <button type="button" id="load-data" class="button">Загрузить данные из JSON-файла</button>
                    <p id="load-status" class="load-status" role="status"></p>
                </div>
            </div>

            <div id="flights" class="flights" aria-live="polite">
                <p class="empty-state">Данные ещё не загружены.</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
