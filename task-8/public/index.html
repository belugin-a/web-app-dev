<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ПР8 — Профили пользователей</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">Практическая работа №8</p>
        <h1>Профили пользователей</h1>
        <p class="lead">
          Трёхзвенное приложение: браузер → Express API → MongoDB.
          Сейчас работает первое звено — сервер и статика.
        </p>

        <div class="status">
          <span class="status__dot" aria-hidden="true"></span>
          <span>Каркас запущен</span>
        </div>

        <dl class="facts">
          <div>
            <dt>Сервер</dt>
            <dd>Node.js + Express</dd>
          </div>
          <div>
            <dt>База данных</dt>
            <dd>подключение — шаг 2</dd>
          </div>
          <div>
            <dt>Клиент</dt>
            <dd>интерфейс — шаги 5–7</dd>
          </div>
        </dl>

        <p class="hint">
          Проверить API:
          <a href="/api/health">/api/health</a>
        </p>
      </section>
    </main>
  </body>
</html>
