<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ПР8 — Профили пользователей</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="header"></header>
    <main class="page" id="app">
      <p class="loading">Загрузка…</p>
    </main>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog" class="dialog__body">
        <h2 class="dialog__title" id="confirm-title">Удалить профиль?</h2>
        <p class="dialog__text" id="confirm-text"></p>
        <div class="dialog__actions">
          <button class="btn" value="cancel">Отмена</button>
          <button class="btn btn--danger" value="confirm">Удалить</button>
        </div>
      </form>
    </dialog>

    <noscript>
      <p class="noscript">Для работы приложения нужен JavaScript.</p>
    </noscript>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
