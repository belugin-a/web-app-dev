<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор на JavaScript</title>
  <meta name="description" content="Простой калькулятор: два числа, выбор арифметической операции и вывод результата.">
  <meta name="theme-color" content="#1F3D2B">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>

<body>

  <noscript>
    <p class="noscript">Для калькулятора нужен JavaScript: включите его в браузере и обновите страницу.</p>
  </noscript>

  <main class="stage">
    <section class="calculator" aria-labelledby="calculator-title">
      <div class="calculator__header">
        <div class="calculator__heading">
          <img class="calculator__logo" src="assets/favicon.svg" alt="" width="36" height="36">
          <h1 class="calculator__title" id="calculator-title">Калькулятор</h1>
        </div>
        <button class="reset" type="button" id="reset">Сбросить</button>
      </div>
      <p class="calculator__hint">Введите два числа и нажмите нужную операцию.</p>

      <div class="calculator__form">
        <div class="calculator__row">
          <label class="field">
            <span class="field__label">Первое число</span>
            <input class="field__input" type="text" id="num1" name="num1" maxlength="10"
              inputmode="decimal" autocomplete="off" spellcheck="false">
          </label>

          <label class="field">
            <span class="field__label">Второе число</span>
            <input class="field__input" type="text" id="num2" name="num2" maxlength="10"
              inputmode="decimal" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <div class="operations" id="operations" role="group" aria-label="Арифметическая операция">
          <button class="operation" type="button" data-op="add">
            <span class="operation__sign" aria-hidden="true">+</span>
            <span class="operation__name">Сложение</span>
          </button>
          <button class="operation" type="button" data-op="sub">
            <span class="operation__sign" aria-hidden="true">−</span>
            <span class="operation__name">Вычитание</span>
          </button>
          <button class="operation" type="button" data-op="mul">
            <span class="operation__sign" aria-hidden="true">×</span>
            <span class="operation__name">Умножение</span>
          </button>
          <button class="operation" type="button" data-op="div">
            <span class="operation__sign" aria-hidden="true">÷</span>
            <span class="operation__name">Деление</span>
          </button>
          <button class="operation" type="button" data-op="root"
            title="Корень указанной степени из первого числа (степень — второе число)">
            <span class="operation__sign" aria-hidden="true">√</span>
            <span class="operation__name">Корень</span>
          </button>
          <button class="operation" type="button" data-op="pow"
            title="Первое число в степени второго числа">
            <span class="operation__sign" aria-hidden="true">xⁿ</span>
            <span class="operation__name">Степень</span>
          </button>
        </div>
      </div>

      <div class="result-block" aria-live="polite" aria-atomic="true">
        <p class="result-block__label">Результат</p>
        <output class="result-block__value" id="result" for="num1 num2">—</output>
      </div>
    </section>
  </main>

</body>

</html>
